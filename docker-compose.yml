services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      platform:
        condition: service_started

  platform:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tdengine:
        condition: service_healthy

  emqx:
    image: emqx/emqx:5.8.8
    environment:
      EMQX_NODE__COOKIE: iot-perform-cookie
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: http
      EMQX_AUTHENTICATION__1__METHOD: post
      EMQX_AUTHENTICATION__1__URL: http://platform:8080/internal/emqx/auth
      EMQX_AUTHENTICATION__1__REQUEST_HEADERS__CONTENT_TYPE: application/json
      EMQX_AUTHENTICATION__1__BODY__USERNAME: "$${username}"
      EMQX_AUTHENTICATION__1__BODY__PASSWORD: "$${password}"
      EMQX_AUTHENTICATION__1__BODY__CLIENTID: "$${clientid}"
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
      EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
      EMQX_AUTHORIZATION__SOURCES__1__URL: http://platform:8080/internal/emqx/acl
      EMQX_AUTHORIZATION__SOURCES__1__REQUEST_HEADERS__CONTENT_TYPE: application/json
      EMQX_AUTHORIZATION__SOURCES__1__BODY__USERNAME: "$${username}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__CLIENTID: "$${clientid}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__TOPIC: "$${topic}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__ACTION: "$${action}"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    volumes:
      - tdengine-data:/var/lib/taos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6041/rest/sql -d 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  tdengine-data:
