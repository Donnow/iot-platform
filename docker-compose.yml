services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      platform:
        condition: service_started

  platform:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tdengine:
        condition: service_healthy

  emqx:
    image: emqx/emqx:5.7.2
    environment:
      EMQX_NODE__COOKIE: iot-perform-cookie
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: http
      EMQX_AUTHENTICATION__1__METHOD: post
      EMQX_AUTHENTICATION__1__URL: http://platform:8080/internal/emqx/auth
      EMQX_AUTHENTICATION__1__BODY: '{"username":"$${username}","password":"$${password}","clientid":"$${clientid}"}'
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
      EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
      EMQX_AUTHORIZATION__SOURCES__1__URL: http://platform:8080/internal/emqx/acl
      EMQX_AUTHORIZATION__SOURCES__1__BODY__USERNAME: "$${username}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__CLIENTID: "$${clientid}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__TOPIC: "$${topic}"
      EMQX_AUTHORIZATION__SOURCES__1__BODY__ACTION: "$${action}"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  # EMQX Open Source does not ship the built-in Webhooks feature (Enterprise
  # only), so device lifecycle events are forwarded via rule engine + HTTP
  # bridge. This one-shot service bootstraps the bridge and the two rules
  # idempotently. EMQX is pinned to 5.7.x: the 5.8 series rule engine was
  # observed not receiving client events on this stack.
  emqx-init:
    image: curlimages/curl:latest
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      EMQX_API: http://emqx:18083/api/v5
      IOT_WEBHOOK_URL: http://platform:8080/internal/emqx/webhook
    volumes:
      - ./scripts/emqx-init.sh:/scripts/emqx-init.sh:ro
    command: ["sh", "-c", "sh /scripts/emqx-init.sh"]
    restart: "no"


  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    volumes:
      - tdengine-data:/var/lib/taos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u root:taosdata http://localhost:6041/rest/sql -d 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  tdengine-data:
  emqx-data:
